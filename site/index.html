<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collezione TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;
  --text:#eef0f4;--muted:#9aa1ad;--accent:#f5c542;--up:#3ecf8e;--down:#ff6b6b;
  --pk:#ffcb05;--op:#e2483d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font:700 20px 'Space Grotesk',sans-serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--accent)}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.hero{background:linear-gradient(135deg,#1d2230,#151820);border:1px solid var(--line);border-radius:18px;padding:18px}
.hero .lbl{color:var(--muted);font-size:13px}
.hero .val{font:700 38px 'Space Grotesk',sans-serif;margin:2px 0 4px}
.delta{font-weight:600;font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.chart{margin-top:14px}
.chart svg{width:100%;height:120px;display:block}
.split{display:flex;gap:10px;margin-top:12px}
.split div{flex:1;background:var(--panel2);border-radius:12px;padding:10px 12px}
.split b{display:block;font:700 17px 'Space Grotesk',sans-serif}
.split small{color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sec h2{font:700 16px 'Space Grotesk',sans-serif;margin:0}
.sec select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center}
.stripe{width:6px;align-self:stretch;border-radius:4px}
.stripe.pk{background:var(--pk)}.stripe.op{background:var(--op)}
.name{font-weight:600;word-break:break-word}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--panel2);color:var(--muted)}
.tag.var{background:#2b2540;color:#c9b6ff}
.right{text-align:right;white-space:nowrap}
.price{font:700 16px 'Space Grotesk',sans-serif}
.sub{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.qty span{min-width:18px;text-align:center}
a.cm{color:var(--accent);font-size:12px;text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1px dashed var(--line);border-radius:14px}
.empty button{margin-top:12px}
.btn{background:var(--accent);color:#1a1400;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.games{display:flex;gap:8px;margin-bottom:10px}
.games button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.games button.on.pk{border-color:var(--pk);color:var(--pk)}
.games button.on.op{border-color:var(--op);color:#ff8a80}
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none}
.search:focus{border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:10px 2px}
.adds{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:0 1 200px;padding:10px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
nav button.on{background:var(--panel2);color:var(--text)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--up);color:#062b1a;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.5}
.loading{color:var(--muted);padding:20px;text-align:center}
.toast{white-space:nowrap}


.item.click{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
.chip:disabled{opacity:.35;cursor:default}
.tag.lang{background:#1d3240;color:#8fd3ff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.ov.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .22s ease;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.sheet h3{font:700 18px 'Space Grotesk',sans-serif;margin:0 30px 4px 0;word-break:break-word}
.sheet .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--panel2);cursor:pointer;font-size:16px}
.sheet label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pgrid div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.pgrid small{color:var(--muted);font-size:11px;display:block}
.pgrid b{font:700 15px 'Space Grotesk',sans-serif}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.btn.full{width:100%;padding:13px;font-size:15px;text-align:center;display:block;text-decoration:none}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.qty.big button{width:38px;height:38px;font-size:18px}
.info{background:none;border:1px solid var(--line);color:var(--muted);border-radius:50%;width:20px;height:20px;font-size:11px;padding:0;margin-left:4px;cursor:pointer;vertical-align:1px}
.tag.own{background:#3a3016;color:var(--accent)}
.own-row{display:flex;gap:6px;align-items:center}
.own-row .search{padding:9px 12px}
.albums{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.albums::-webkit-scrollbar{display:none}
.alb{flex:0 0 auto;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.alb small{color:var(--muted);font-weight:500;margin-left:2px}
.alb.on{background:var(--text);color:var(--bg)}
.alb.on small{color:#555}
.alb.new{border-style:dashed;color:var(--accent)}
.albhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 12px}
.albhead h2{font:700 18px 'Space Grotesk',sans-serif;margin:0;word-break:break-word}
.albhead div{white-space:nowrap}
.tag.alb-t{background:#22301f;color:#a6e3a1}
.intro{margin:2px 2px 14px}
.intro h2{font:700 22px 'Space Grotesk',sans-serif;margin:0 0 4px}
.intro p{margin:0;color:var(--muted);font-size:14px}
.plus{margin-top:6px;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--accent);font-size:18px;font-weight:700;cursor:pointer}
.sec .sub{font-size:12px}
.sheet a.btn.ghost{color:var(--text)}
.acct{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:34px}
.acct .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a1400;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.acct .sy{font-size:12px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;background:#1b2636;border:1px solid #2b3d55;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;cursor:pointer;line-height:1.4}
.sheet form label{margin-top:14px}
.mid{display:flex;gap:10px;align-items:flex-start;min-width:0}
.th{width:46px;height:64px;border-radius:4px;object-fit:cover;flex:0 0 auto;background:var(--panel2)}
.bigwrap{text-align:center;margin:4px 0 12px}
.big{width:100%;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);aspect-ratio:600/825;background:var(--panel2)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <header><h1>Collezione<span>TCG</span></h1><button id="acct" class="acct" onclick="openAcct()">Accedi</button></header>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<nav>
  <button id="t-home" onclick="go('home')">🔎 Prezzi</button>
  <button id="t-coll" onclick="go('coll')">📁 La mia collezione</button>
</nav>
<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script>
const GAMES={
  pk:{name:'Pokémon',slug:'Pokemon',hl:'Reverse Holo',langs:['it','en','ja'],shards:4000},
  op:{name:'One Piece',slug:'OnePiece',hl:'Foil',langs:['en','ja'],shards:1000}
};
const LANGS={it:{n:'Italiano',cm:5},en:{n:'Inglese',cm:1},ja:{n:'Giapponese',cm:7}};
const DB={},LOADING={};
let tab=(()=>{try{return localStorage.getItem('tcg-tab')||'home'}catch(e){return 'home'}})(),game='pk',query='',sortBy='value',langF='all',albF='all',cq='',lastAlb=null,ROWS=[],range=30;
let albums=[]; // [{id,name}]
const AKEY='tcg-album-v1';
try{albums=JSON.parse(localStorage.getItem(AKEY)||'[]')}catch(e){albums=[]}
function saveAlb(){try{localStorage.setItem(AKEY,JSON.stringify(albums))}catch(e){}scheduleSync()}
const albName=id=>{const a=albums.find(a=>a.id===id);return a?a.name:null};
let coll=[];   // [{g,id,h,l,q}]
const KEY='tcg-collezione-v1';
try{coll=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){coll=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(coll))}catch(e){}scheduleSync()}

const eur=v=>v==null?'—':v.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\/\u3040-\u30ff\u4e00-\u9fff]+/g,' ').replace(/([\u3040-\u30ff\u4e00-\u9fff])(\d)/g,'$1 $2').trim();
const words=q=>norm(q).split(' ').filter(Boolean);
const hit=(c,w)=>/^\d+$/.test(w)?(c.lc.includes(' '+w+' ')||c.lc.includes(' '+w+'/')||c.lc.includes(' '+w.replace(/^0+(?=\d)/,'')+' ')):c.lc.includes(w);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function load(g){
  if(DB[g])return Promise.resolve(DB[g]);
  if(LOADING[g])return LOADING[g];
  LOADING[g]=fetch('data/'+g+'.json').then(r=>r.json()).then(d=>{
    const byId=new Map();
    d.cards.forEach(c=>{c.lc=' '+norm(c[1]+' '+c[2]+' '+c[4]+' '+c[6]+' '+c[8]+' '+(c[4].split('/')[0].replace(/^0+(?=\d)/,'')))+' ';byId.set(c[0],c)});
    DB[g]={date:d.date,cards:d.cards,byId};return DB[g];
  });
  return LOADING[g];
}
// riga carta: [id,nome,set,versione,numero,extra,nomeIT,soloGiapponese,paroleChiave,immagine,trend,media7,media30,(trend,media7,media30 reverse/foil)]
const PO=10;
const IMG=(c,q)=>!c[9]?'':c[9].startsWith('B:')?'https://en.onepiece-cardgame.com/images/cardlist/card/'+encodeURIComponent(c[9].slice(2))+'.png':'https://assets.tcgdex.net/'+c[9].split('/').map(encodeURIComponent).join('/')+'/'+q+'.webp';
const thumb=c=>c[9]?`<img class="th" src="${IMG(c,'low')}" alt="" loading="lazy" onerror="this.remove()">`:'';
const bigImg=(c,w)=>c[9]?`<div class="bigwrap"><img class="big" style="max-width:${w||220}px" src="${IMG(c,'high')}" alt="Immagine della carta" onerror="this.parentNode.remove()"></div>`:'';
function prices(c,h){const o=h?PO+3:PO;return{now:c[o]||null,d7:c[o+1]||null,d30:c[o+2]||null}}
function hasHolo(c){return c.length>PO+3&&!!c[PO+3]}
function hasStd(c){return !!c[PO]}
function setLabel(g,c){return c[2]+(c[4]&&g==='pk'?' · '+c[4]:'')}
function tags(g,c){return (c[5]?`<span class="tag var">${esc(c[5])}</span>`:'')+(c[3]?`<span class="tag">Versione ${c[3]}</span>`:'')}
function itName(c){return c[6]?`<div class="meta">IT: ${esc(c[6])}</div>`:''}
function defLang(g,c){return c[7]?'ja':g==='pk'?'it':'en'}
function cmLink(g,id,l){return 'https://www.cardmarket.com/it/'+GAMES[g].slug+'/Products?idProduct='+id+(l?'&language='+LANGS[l].cm:'')}
function pct(a,b){if(!a||!b)return null;return (a-b)/b*100}
function deltaHTML(p,suffix){if(p==null)return '<span class="flat">—</span>';const c=p>0.5?'up':p<-0.5?'down':'flat';return `<span class="${c}">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p).toFixed(1).replace('.',',')}%${suffix||''}</span>`}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1400)}

function go(t){tab=t;try{localStorage.setItem('tcg-tab',t)}catch(e){}closeSheet();render();window.scrollTo(0,0)}
function render(){document.getElementById('t-coll').classList.toggle('on',tab==='coll');document.getElementById('t-home').classList.toggle('on',tab==='home');tab==='coll'?renderColl():renderHome();renderFoot()}
function renderFoot(){
  const d=Object.values(DB)[0];
  document.getElementById('foot').innerHTML=`Valori: Price Trend di Cardmarket, media di tutte le lingue e condizioni${d?' (aggiornato al '+d.date.split('-').reverse().join('/')+')':''}. Set, numeri e immagini delle carte Pokémon: TCGdex. Immagini Pokémon © Pokémon/Nintendo/Creatures/GAME FREAK. Immagini One Piece © Eiichiro Oda/Shueisha, Toei Animation, Bandai. Questo sito non è affiliato con Cardmarket.<br>${user?'La tua collezione è salvata online nel tuo account.':'Senza account la collezione resta solo su questo dispositivo: <a class="cm" href="#" onclick="openAcct();return false">accedi per salvarla online</a>.'}`;
}

/* ---------- COLLEZIONE ---------- */
async function renderColl(){
  const v=document.getElementById('view');
  coll.forEach(x=>{if(!x.l)x.l=x.g==='pk'?'it':'en'});
  if(!coll.length){v.innerHTML=`<div class="empty"><b>La tua collezione è vuota</b><br>Aggiungi le tue prime carte Pokémon o One Piece per vederne il valore di mercato.<br><button class="btn" onclick="go('home')">Aggiungi carte</button></div>`;return}
  const gs=[...new Set(coll.map(x=>x.g))];
  if(gs.some(g=>!DB[g])){v.innerHTML='<div class="loading">Carico i prezzi…</div>';await Promise.all(gs.map(load));if(tab!=='coll')return}
  coll.forEach(x=>{if(x.a&&!albName(x.a))delete x.a});
  if(albF!=='all'&&albF!=='none'&&!albName(albF))albF='all';
  const inAlb=x=>albF==='all'||(albF==='none'?!x.a:x.a===albF);
  const usedL=[...new Set(coll.filter(inAlb).map(x=>x.l))];
  if(langF!=='all'&&!usedL.includes(langF))langF='all';
  const noAlb=coll.some(x=>!x.a);
  let tot={now:0,d7:0,d30:0},per={pk:0,op:0},rows=[],n=0;
  coll.forEach((x,i)=>{
    if(!inAlb(x)||(langF!=='all'&&x.l!==langF))return;
    const c=DB[x.g].byId.get(x.id);if(!c)return;
    const p=prices(c,x.h),own=x.mp!=null;
    const u=own?x.mp:(p.now||0),u7=own?x.mp:(p.d7||p.now||0),u30=own?x.mp:(p.d30||p.d7||p.now||0);
    const now=u*x.q;n+=x.q;
    tot.now+=now;tot.d7+=u7*x.q;tot.d30+=u30*x.q;per[x.g]+=now;
    rows.push({x,i,c,p,own,unit:u,val:now,ch:own?null:pct(p.now,p.d30)});
  });
  rows.sort(sortBy==='value'?(a,b)=>b.val-a.val:sortBy==='up'?(a,b)=>(b.ch??-1e9)-(a.ch??-1e9):(a,b)=>(a.ch??1e9)-(b.ch??1e9));
  ROWS=rows;
  const banner=(!user&&sb&&coll.length)?`<div class="banner" onclick="openAcct()">☁️ <span><b>Salva la collezione online</b><br>Crea un account gratuito per non perderla e ritrovarla su tutti i dispositivi.</span></div>`:'';
  const albTitle=albF==='all'?'':albF==='none'?'Carte senza album':albName(albF);
  v.innerHTML=`${banner}
  <div class="albums" role="tablist" aria-label="Album">
    <button class="alb${albF==='all'?' on':''}" onclick="setAlb('all')">Tutta la collezione</button>
    ${albums.map(a=>`<button class="alb${albF===a.id?' on':''}" onclick="setAlb('${a.id}')">${esc(a.name)} <small>${coll.filter(x=>x.a===a.id).reduce((s,x)=>s+x.q,0)}</small></button>`).join('')}
    ${albums.length&&noAlb?`<button class="alb${albF==='none'?' on':''}" onclick="setAlb('none')">Senza album</button>`:''}
    <button class="alb new" onclick="openAlbName('new')">+ Nuovo album</button>
  </div>
  ${albF!=='all'&&albF!=='none'?`<div class="albhead"><h2>${esc(albTitle)}</h2><div><button class="btn sm ghost" onclick="openAlbName('rename','${albF}')">Rinomina</button> <button class="btn sm ghost" onclick="openAlbDel('${albF}')">Elimina</button></div></div>`:''}
  ${!rows.length&&albF!=='all'?`<div class="empty"><b>${albF==='none'?'Nessuna carta senza album':'Questo album è vuoto'}</b><br>Quando aggiungi una carta, scegli l'album in cui metterla. Puoi anche spostare una carta che hai già: aprila e cambia album.<br><button class="btn" onclick="go('home')">Aggiungi carte</button></div>`:`
  ${usedL.length>1?`<div class="chips"><button class="chip${langF==='all'?' on':''}" onclick="langF='all';renderColl()">Tutte le lingue</button>${['it','en','ja'].filter(l=>usedL.includes(l)).map(l=>`<button class="chip${langF===l?' on':''}" onclick="langF='${l}';renderColl()">${LANGS[l].n}</button>`).join('')}</div>`:''}
  <section class="hero">
    <div class="lbl">Valore stimato ${albF==='all'?'della collezione':albF==='none'?'carte senza album':'album “'+esc(albTitle)+'”'}${langF==='all'?'':' · '+LANGS[langF].n.toLowerCase()} · ${n} cart${n===1?'a':'e'} <button class="info" onclick="openInfo()" aria-label="Come calcoliamo il valore">ⓘ</button></div>
    <div class="val">${eur(tot.now)}</div>
    <div class="delta">${deltaHTML(pct(tot.now,tot.d30),' rispetto alla media 30 giorni')}</div>
    <div class="chart" id="hchart">${chart([tot.d30,tot.d7,tot.now])}</div>
    <div class="split">
      <div><small>Pokémon</small><b>${eur(per.pk)}</b></div>
      <div><small>One Piece</small><b>${eur(per.op)}</b></div>
    </div>
  </section>
  <div class="sec"><h2>Le tue carte</h2>
    <select onchange="sortBy=this.value;renderColl()" aria-label="Ordina">
      <option value="value"${sortBy==='value'?' selected':''}>Più preziose</option>
      <option value="up"${sortBy==='up'?' selected':''}>In crescita</option>
      <option value="down"${sortBy==='down'?' selected':''}>In calo</option>
    </select></div>

/* ---------- STORICO PREZZI ---------- */
const HIST={},HLOAD={};
function shard(g,id){const s=id%GAMES[g].shards,k=g+s;
  if(HIST[k])return Promise.resolve(HIST[k]);
  if(!HLOAD[k])HLOAD[k]=fetch('storico/'+g+'/'+s+'.json').then(r=>r.ok?r.json():null).catch(()=>null).then(d=>HIST[k]=d||{d:[],v:{}});
  return HLOAD[k];
}
async function seriesFor(list){ // list: [{g,id,h,q,mp}] -> {dates,vals}
  const hs=await Promise.all(list.map(x=>shard(x.g,x.id)));
  const ds=new Set();hs.forEach(h=>h.d.forEach(d=>ds.add(d)));
  const dates=[...ds].sort();
  const vals=dates.map(()=>0);
  list.forEach((x,i)=>{
    const h=hs[i],arr=h.v[x.id+(x.h?'h':'')]||[],cur=prices(DB[x.g].byId.get(x.id),x.h).now||0;
    const at=new Map(h.d.map((d,j)=>[d,arr[j]]));
    let last=null;
    const firstKnown=arr.find(v=>v!=null)??cur;
    dates.forEach((d,j)=>{let v=at.get(d);if(v==null)v=last??firstKnown;last=v;vals[j]+=(x.mp!=null?x.mp:v)*x.q});
  });
  return {dates,vals};
}
async function histChart(rows){
  const el=document.getElementById('hchart');if(!el)return;
  const {dates,vals}=await seriesFor(rows.map(r=>r.x));
  if(!document.getElementById('hchart'))return;
  if(dates.length<7){
    if(dates.length)el.insertAdjacentHTML('beforeend',`<div class="note">Lo storico giornaliero è partito il ${fmtD(dates[0])}: il grafico giorno per giorno comparirà dopo una settimana di dati.</div>`);
    return;
  }
  const opts=[[7,'7 gg'],[30,'30 gg'],[90,'3 mesi'],[365,'1 anno']].filter(([n])=>n<=Math.max(7,dates.length)||n===7);
  if(!opts.some(o=>o[0]===range))range=opts[opts.length-1][0];
  const n=Math.min(range,dates.length),D=dates.slice(-n),V=vals.slice(-n);
  el.innerHTML=lineChart(D,V)+`<div class="chips" style="margin:10px 0 0">${opts.map(([k,t])=>`<button class="chip${k===range?' on':''}" onclick="range=${k};histChart(ROWS)">${t}</button>`).join('')}</div>`;
}
const fmtD=d=>d.split('-').reverse().slice(0,2).join('/');
function lineChart(D,V){
  const W=600,H=130,P=6,mx=Math.max(...V),mn=Math.min(...V),rg=(mx-mn)||mx*0.1||1;
  const pts=V.map((v,i)=>[P+i*(W-2*P)/Math.max(1,V.length-1),H-24-((v-mn)/rg)*(H-40)]);
  const up=V[V.length-1]>=V[0],col=up?'var(--up)':'var(--down)',hex=up?'#3ecf8e':'#ff6b6b';
  const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const ch=pct(V[V.length-1],V[0]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Andamento del valore">
   <defs><linearGradient id="gr2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${hex}" stop-opacity=".35"/><stop offset="1" stop-color="${hex}" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L${pts[pts.length-1][0]},${H-18} L${pts[0][0]},${H-18} Z" fill="url(#gr2)"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="3" vector-effect="non-scaling-stroke"/>
  </svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>${fmtD(D[0])}<br><b style="color:var(--text)">${eur(V[0])}</b></span><span style="text-align:center">nel periodo<br><b>${deltaHTML(ch)}</b></span><span style="text-align:right">${fmtD(D[D.length-1])}<br><b style="color:var(--text)">${eur(V[V.length-1])}</b></span></div>`;
}
async function cardHist(x){
  const el=document.getElementById('ichart');if(!el)return;
  const {dates,vals}=await seriesFor([{...x,q:1,mp:null}]);
  if(!document.getElementById('ichart'))return;
  el.innerHTML=dates.length>=7?'<label>Andamento del prezzo</label>'+lineChart(dates.slice(-90),vals.slice(-90)):'';
}

function chart(vals){
  const W=600,H=120,P=12,labels=['30 giorni fa (media)','7 giorni fa (media)','Oggi'];
  const mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||mx*0.1||1;
  const pts=vals.map((v,i)=>[P+i*(W-2*P)/2,H-28-((v-mn)/rg)*(H-50)]);
  const up=vals[2]>=vals[0],col=up?'var(--up)':'var(--down)',hex=up?'#3ecf8e':'#ff6b6b';
  const d='M'+pts.map(p=>p.join(',')).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Andamento del valore">
   <defs><linearGradient id="gr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${hex}" stop-opacity=".35"/><stop offset="1" stop-color="${hex}" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L${pts[2][0]},${H-22} L${pts[0][0]},${H-22} Z" fill="url(#gr)"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="3" vector-effect="non-scaling-stroke"/>
   ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${col}"/>`).join('')}
  </svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">${labels.map((l,i)=>`<span>${l}<br><b style="color:var(--text)">${eur(vals[i])}</b></span>`).join('')}</div>`;
}

  m.sort((a,b)=>b[0]-a[0]);

  return MOVERS[g]={up:m.slice(0,8).map(x=>x[1]),down:m.slice(-8).reverse().map(x=>x[1]),top};

    <div class="sec"><h2>📈 In crescita</h2><span class="sub">ultimi 30 giorni · da 10 € in su</span></div><div class="list">${m.up.map(c=>cardRow(game,c)).join('')}</div>
    <div class="sec"><h2>📉 In calo</h2><span class="sub">ultimi 30 giorni · da 10 € in su</span></div><div class="list">${m.down.map(c=>cardRow(game,c)).join('')}</div>
    <div class="sec"><h2>💎 Le più preziose</h2></div><div class="list">${m.top.map(c=>cardRow(game,c)).join('')}</div>`;
    return;
  }
  const hits=[];for(const c of DB[game].cards){if(ws.every(w=>hit(c,w)))hits.push(c)}
  hits.sort((a,b)=>Math.max(b[PO]||0,b[PO+3]||0)-Math.max(a[PO]||0,a[PO+3]||0));
  r.innerHTML=`<p class="hint">${hits.length.toLocaleString('it-IT')} risultati${hits.length>60?' · mostro i 60 più preziosi, aggiungi parole per restringere':''}. Tocca una carta per vedere l'andamento del prezzo.</p>
  <div class="list">${hits.slice(0,60).map(c=>cardRow(game,c)).join('')}</div>`;
}

/* Scheda di una carta (per tutti, anche senza collezione) */
function openCard(g,id){const c=DB[g].byId.get(id);S={mode:'card',g,id,h:hasStd(c)?0:1};drawCard()}
function drawCard(){
  const c=DB[S.g].byId.get(S.id),p=prices(c,S.h),own=coll.filter(x=>x.g===S.g&&x.id===S.id).reduce((s,x)=>s+x.q,0);
  showSheet(`${bigImg(c,240)}<h3>${esc(c[1])}</h3><div class="meta"><span class="tag">${GAMES[S.g].name} · ${esc(setLabel(S.g,c))}</span>${c[7]?'<span class="tag lang">Giapponese</span>':''}${tags(S.g,c)}</div>${itName(c)}
   ${hasStd(c)&&hasHolo(c)?`<label>Versione</label><div class="chips">${verChips(S.g,c,S.h,'cSetH')}</div>`:''}
   ${priceGrid(c,S.h)}
   <div class="note">Variazione in 30 giorni: ${deltaHTML(pct(p.now,p.d30))}</div>
   <div id="cchart" class="chart"><label>Andamento del prezzo</label>${chart([p.d30||p.d7||p.now,p.d7||p.now,p.now])}</div>
   ${own?`<div class="note" style="margin-top:12px">📁 Ne hai ${own} in collezione.</div>`:''}
   <div style="margin-top:16px"><button class="btn full" onclick="openAdd('${S.g}',${S.id})">+ Aggiungi alla collezione</button></div>
   <div style="margin-top:8px"><a class="btn ghost full" href="${cmLink(S.g,S.id)}" target="_blank" rel="noopener">Vedi su Cardmarket ↗</a></div>`);
  cardChart(S.g,S.id,S.h);
}
function cSetH(h){S.h=h;drawCard()}
async function cardChart(g,id,h){
  const {dates,vals}=await seriesFor([{g,id,h,q:1,mp:null}]);
  const el=document.getElementById('cchart');if(!el||!S||S.id!==id||S.h!==h)return;
  if(dates.length<7)return; // finché lo storico è corto resta il grafico con le medie
  const n=Math.min(range,dates.length),opts=[[7,'7 gg'],[30,'30 gg'],[90,'3 mesi'],[365,'1 anno']].filter(([k])=>k===7||k<=dates.length);
  el.innerHTML='<label>Andamento del prezzo</label>'+lineChart(dates.slice(-n),vals.slice(-n))+`<div class="chips" style="margin:10px 0 0">${opts.map(([k,t])=>`<button class="chip${k===range?' on':''}" onclick="range=${k};cardChart('${g}',${id},${h})">${t}</button>`).join('')}</div>`;
}

function scheduleSync(){if(!user||!sb)return;clearTimeout(syncT);setSync('saving');syncT=setTimeout(pushRemote,800)}
async function pushRemote(){
  syncT=null;if(!user)return;
  const now=new Date().toISOString();
  const {error}=await sb.from('collezioni').upsert({user_id:user.id,dati:{v:1,coll,albums},aggiornato:now});
  if(error){setSync('error');console.warn(error);return}
  lastSync=now;lsSet('tcg-synced-at',now);setSync('ok');
}
async function pullRemote(){
  const {data,error}=await sb.from('collezioni').select('dati,aggiornato').eq('user_id',user.id).maybeSingle();
  if(error)throw error;return data;
}
function applyRemote(r){
  coll=Array.isArray(r.dati.coll)?r.dati.coll:[];albums=Array.isArray(r.dati.albums)?r.dati.albums:[];
  lsSet(KEY,JSON.stringify(coll));lsSet(AKEY,JSON.stringify(albums));lastSync=r.aggiornato;lsSet('tcg-synced-at',r.aggiornato);
}
function mergeInto(r){ // aggiunge le carte di questo dispositivo a quelle dell'account
  const rc=Array.isArray(r.dati.coll)?r.dati.coll:[],ra=Array.isArray(r.dati.albums)?r.dati.albums:[];
  const map={};albums.forEach(a=>{const same=ra.find(b=>b.name.toLowerCase()===a.name.toLowerCase());if(same)map[a.id]=same.id;else{ra.push(a);map[a.id]=a.id}});
  coll.forEach(x=>{const y={...x};if(y.a)y.a=map[y.a];const e=rc.find(z=>z.g===y.g&&z.id===y.id&&z.h===y.h&&z.l===y.l&&(z.a||null)===(y.a||null));if(e)e.q+=y.q;else rc.push(y)});
  coll=rc;albums=ra;lsSet(KEY,JSON.stringify(coll));lsSet(AKEY,JSON.stringify(albums));
}
async function onLogin(){
  setSync('saving');
  let r;try{r=await pullRemote()}catch(e){setSync('error');return}
  const hasRemote=r&&r.dati&&((r.dati.coll||[]).length||(r.dati.albums||[]).length);
  const hasLocal=coll.length||albums.length;
  const mine=lsGet('tcg-owner')===user.id;
  lsSet('tcg-owner',user.id);
  if(mine){ if(r)applyRemote(r);else await pushRemote(); }
  else if(hasLocal&&hasRemote){ askMerge(r);return }
  else if(hasLocal){ await pushRemote() }
  else if(r){ applyRemote(r) }
  setSync('ok');render();
}
function askMerge(r){
  const n=coll.reduce((s,x)=>s+x.q,0);
  S={mode:'merge'};pendingMerge=r;
  showSheet(`<h3>Carte su questo dispositivo</h3>
   <p class="note" style="font-size:14px;color:var(--text)">Su questo dispositivo ci ${n===1?'è <b>1 carta</b> che non è':'sono <b>'+n+' carte</b> che non sono'} ancora nel tuo account. Il tuo account ha già una collezione salvata.</p>
   <div style="margin-top:14px"><button class="btn full" id="m-yes">Aggiungile al mio account</button></div>
   <div style="margin-top:8px"><button class="btn ghost full" id="m-no">No, usa solo la collezione dell'account</button></div>`);
  document.getElementById('m-yes').onclick=async()=>{pendingMerge=null;mergeInto(r);closeSheet();await pushRemote();render();toast('Collezioni unite ✓')};
  document.getElementById('m-no').onclick=()=>{pendingMerge=null;applyRemote(r);closeSheet();setSync('ok');render()};
}
function onLogout(){
  coll=[];albums=[];lsSet(KEY,null);lsSet(AKEY,null);lsSet('tcg-owner',null);lsSet('tcg-synced-at',null);
  albF='all';langF='all';setSync('');render();
}
function setSync(s){syncState=s;updateHeader();if(S&&S.mode==='acct')drawAcct()}
function updateHeader(){
  const b=document.getElementById('acct');if(!b)return;
  if(user){const dot=syncState==='saving'?'⏳':syncState==='error'?'⚠️':'✓';b.innerHTML=`<span class="av">${esc((user.email||'?')[0].toUpperCase())}</span><span class="sy">${dot}</span>`;b.setAttribute('aria-label','Il tuo account')}
  else{b.textContent='Accedi';b.setAttribute('aria-label','Accedi o crea un account')}
}
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null;
    if(ev==='PASSWORD_RECOVERY')setTimeout(openNewPass,0);
    if(u&&(!user||user.id!==u.id)){user=u;setTimeout(onLogin,0)}
    else if(!u&&user){user=null;setTimeout(onLogout,0)}
    else if(u)user=u;
    updateHeader();
  });
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||!user||syncT)return;
    try{const r=await pullRemote();if(r&&r.aggiornato!==lastSync&&!syncT){applyRemote(r);render()}}catch(e){}
  });
}

/* Foglio account */
let acctMode='login',acctMsg='';
function openAcct(){S={mode:'acct'};acctMsg='';drawAcct()}
function drawAcct(){
  if(!sb){showSheet(`<h3>Account</h3><p class="note">Il servizio account non è raggiungibile in questo momento. Riprova più tardi.</p>`);return}
  if(user){
    const st=syncState==='saving'?'⏳ Salvataggio in corso…':syncState==='error'?'⚠️ Salvataggio non riuscito: controlla la connessione, riproveremo alla prossima modifica.':'✓ Collezione salvata online';
    showSheet(`<h3>Il tuo account</h3><div class="meta">${esc(user.email)}</div>
     <p class="note" style="font-size:14px;color:var(--text);margin-top:14px">${st}</p>
     <p class="note">Entra con la stessa email da qualsiasi telefono o computer per ritrovare collezione e album.</p>
     <div style="margin-top:16px"><button class="btn ghost full" onclick="logout()">Esci</button></div>`);return}
  const reg=acctMode==='signup',fg=acctMode==='forgot';
  showSheet(`<h3>${fg?'Recupera la password':reg?'Crea un account':'Accedi'}</h3>
   <p class="note">${fg?'Ti mandiamo un\'email con il link per scegliere una nuova password.':'Salva la collezione online e ritrovala su tutti i tuoi dispositivi. Senza account resta solo su questo dispositivo.'}</p>
   ${fg?'':`<div class="chips" style="margin-top:12px"><button class="chip${!reg?' on':''}" onclick="acctMode='login';acctMsg='';drawAcct()">Ho già un account</button><button class="chip${reg?' on':''}" onclick="acctMode='signup';acctMsg='';drawAcct()">Sono nuovo</button></div>`}
   <form id="af" novalidate>
    <label for="ae">Email</label><input id="ae" class="search" type="email" autocomplete="email" inputmode="email" required>
    ${fg?'':`<label for="ap">Password${reg?' (almeno 8 caratteri)':''}</label><input id="ap" class="search" type="password" autocomplete="${reg?'new-password':'current-password'}" required>`}
    <div id="amsg" class="note" style="font-size:14px;color:var(--text);min-height:1em;margin-top:10px">${acctMsg}</div>
    <div style="margin-top:12px"><button class="btn full" type="submit" id="ab">${fg?'Mandami il link':reg?'Crea account':'Accedi'}</button></div>
   </form>
   <div style="margin-top:10px;text-align:center">${fg?`<a class="cm" href="#" onclick="acctMode='login';acctMsg='';drawAcct();return false">← Torna all'accesso</a>`:reg?'':`<a class="cm" href="#" onclick="acctMode='forgot';acctMsg='';drawAcct();return false">Password dimenticata?</a>`}</div>`);
  const em=lsGet('tcg-last-email');if(em)document.getElementById('ae').value=em;
  document.getElementById('af').addEventListener('submit',acctSubmit);
}
function itErr(e){
  const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login'))return 'Email o password sbagliate.';
  if(m.includes('not confirmed'))return 'Prima conferma l\'email: apri il link che ti abbiamo mandato, poi accedi.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'Esiste già un account con questa email: scegli "Ho già un account".';
  if(m.includes('rate limit')||m.includes('too many'))return 'Troppi tentativi ravvicinati: riprova tra qualche minuto.';
  if(m.includes('password'))return 'La password non va bene: usa almeno 8 caratteri.';
  if(m.includes('email'))return 'Controlla di aver scritto bene l\'email.';
  return 'Qualcosa non ha funzionato. Riprova tra poco.';
}
async function acctSubmit(ev){
  ev.preventDefault();
  const email=document.getElementById('ae').value.trim(),pe=document.getElementById('ap'),pass=pe?pe.value:'';
  const msg=t=>{acctMsg=t;const m=document.getElementById('amsg');if(m)m.textContent=t};
  if(!/^\S+@\S+\.\S+$/.test(email))return msg('Scrivi un indirizzo email valido.');
  if(acctMode!=='forgot'&&pass.length<(acctMode==='signup'?8:1))return msg(acctMode==='signup'?'La password deve avere almeno 8 caratteri.':'Scrivi la password.');
  lsSet('tcg-last-email',email);
  const b=document.getElementById('ab');b.disabled=true;b.textContent='Un attimo…';
  try{
    if(acctMode==='login'){const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;closeSheet();toast('Bentornato ✓')}
    else if(acctMode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:SITE}});if(error)throw error;
      if(data.session){closeSheet();toast('Account creato ✓')}
      else{acctMode='login';acctMsg='📧 Ti abbiamo mandato un\'email: apri il link per confermare l\'account, poi torna qui e accedi.';drawAcct()}
    } else {
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE});if(error)throw error;
      msg('📧 Se l\'email è registrata, ti è arrivato il link per scegliere una nuova password.');b.disabled=false;b.textContent='Mandami il link';
    }
  }catch(e){msg(itErr(e));b.disabled=false;b.textContent=acctMode==='login'?'Accedi':acctMode==='signup'?'Crea account':'Mandami il link'}
}
function openNewPass(){
  S={mode:'newpass'};
  showSheet(`<h3>Scegli una nuova password</h3><form id="npf"><label for="np">Nuova password (almeno 8 caratteri)</label><input id="np" class="search" type="password" autocomplete="new-password"><div id="npm" class="note" style="font-size:14px;color:var(--text);margin-top:10px"></div><div style="margin-top:12px"><button class="btn full" type="submit">Salva password</button></div></form>`);
  document.getElementById('npf').addEventListener('submit',async ev=>{ev.preventDefault();const p=document.getElementById('np').value;const m=document.getElementById('npm');
    if(p.length<8){m.textContent='La password deve avere almeno 8 caratteri.';return}
    const {error}=await sb.auth.updateUser({password:p});if(error){m.textContent=itErr(error);return}closeSheet();toast('Password aggiornata ✓')});
}
async function logout(){await sb.auth.signOut();closeSheet();toast('Sei uscito')}

updateHeader();
render();
