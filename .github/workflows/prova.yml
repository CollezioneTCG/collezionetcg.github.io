name: Prova (temporaneo)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://collezionetcg.github.io/data/pk.json -o pk.json
          python3 -c "
          import json,collections
          d=[r for r in json.load(open('pk.json'))['cards'] if r[7]==2]
          print(collections.Counter(r[2] for r in d).most_common(12))
          for r in sorted(d,key=lambda r:-(r[10] or 0))[:6]: print(r[1],'|',r[2],'|',r[10])
          "
