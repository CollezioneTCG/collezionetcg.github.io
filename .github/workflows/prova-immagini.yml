name: Prova immagini One Piece (temporaneo)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in OP05-119 OP05-119_p1 OP05-119_p2 OP05-119_p3 OP01-001_p1 ST01-012 EB01-001; do
            for u in "https://en.onepiece-cardgame.com/images/cardlist/card/$id.png" ; do
              echo "$id $(curl -s -o /tmp/x -w '%{http_code} %{content_type} %{size_download}' -H 'Referer: https://spedyswan.github.io/' "$u")"
            done
          done
          curl -sI "https://en.onepiece-cardgame.com/images/cardlist/card/OP05-119.png" | head -20
