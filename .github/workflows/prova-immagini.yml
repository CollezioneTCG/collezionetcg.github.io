name: Prova immagini One Piece (temporaneo)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://spedyswan.github.io/collezione-tcg/data/op.json -o op.json; ls -la op.json
          python3 -c "import json;d=json.load(open('op.json'))['cards'];print('con immagine:',sum(1 for r in d if r[9]));print([r[:10] for r in d if 'OP05-119' in r[1]][:3])"
          curl -s https://spedyswan.github.io/collezione-tcg/ | grep -o "onepiece-cardgame.com/images[^']*" | head -2
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for h in "Referer: https://spedyswan.github.io/" "Referer: https://spedyswan.github.io/collezione-tcg/" "X-None: 1"; do
            echo "$h -> $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' -A "$UA" -H "$h" -H 'Sec-Fetch-Dest: image' -H 'Sec-Fetch-Mode: no-cors' -H 'Sec-Fetch-Site: cross-site' -H 'Accept: image/webp,image/avif,image/*,*/*;q=0.8' https://en.onepiece-cardgame.com/images/cardlist/card/OP05-119_p1.png)"
          done
          curl -sI -A "$UA" -H 'Referer: https://spedyswan.github.io/' https://en.onepiece-cardgame.com/images/cardlist/card/OP05-119_p1.png | grep -iE "cross-origin|policy|location|HTTP"
